# Local regtest chain. No peers, no real money, no network connection.
regtest=1
server=1

# regtest has no fee history, so sendtoaddress needs a fallback rate.
fallbackfee=0.0002

# Settings that are specific to a network must live in its section,
# otherwise bitcoind refuses to start.
[regtest]
listen=1
port=18444
rpcport=18443
rpcbind=127.0.0.1
txindex=1

# Core 32.1 drops bip125-replaceable from mempool RPCs unless this is set;
# ord 0.29.1 requires the field when polling the commit transaction.
deprecatedrpc=bip125
