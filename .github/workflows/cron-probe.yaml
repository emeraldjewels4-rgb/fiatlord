name: cron-probe

# Throwaway. Not part of the project: it exists only to answer one question -
# does any scheduled workflow fire in this repository? If this never produces a
# schedule-event run, the block is repository-wide and live-check.yaml is not
# special. Delete after one observation window.

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say it fired
        run: echo "cron-probe fired"
