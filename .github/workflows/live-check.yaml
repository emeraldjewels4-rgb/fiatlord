name: live-check

# Production is a deployed Worker, so nothing in CI sees it: the staging check
# compares the checkout with a tree built from that same checkout, and passes
# whether or not the deploy ever landed. A host without its DB binding, a
# stored row that stopped being readable, and a deployment that is simply old
# all keep answering prices until the upstream dies - and the page then falls
# back to simulated ones without saying why.
#
# This runs the same three questions a person would ask by hand: which worker is
# deployed, does it have a database, and does a cold read still carry the row.
# A stale deploy shows up here as a worker id mismatch, which is also how a
# half-committed deploy state becomes visible instead of remembered.
#
# Three ways to get a run:
#   - every 30 minutes, from the default branch only (a schedule is ignored on
#     any other branch);
#   - by hand: Actions -> live-check -> "Run workflow" (workflow_dispatch), or
#     `gh workflow run live-check.yaml`;
#   - on any push that touches this file or the check itself, so a change to
#     the check is exercised at once instead of at the next tick.
#
# The file is .yaml, not .yml, on purpose: it was renamed once because the cron
# in the .yml file never fired - GitHub's workflow object for that path kept its
# original updated_at through two edits, as if the schedule had never been
# registered. A new path is a new workflow id, and a new id registers cleanly.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-check.yaml
      - build/check_live.py

permissions:
  contents: read

# One run at a time: a slow run must not pile up behind the schedule, and a
# manual run should not race a scheduled one against the same row.
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    name: live host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: an undeployed host is named by the commit whose worker id
      # it still runs, which means walking back over the worker's own commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The worker id is computed by build/worker-id.mjs, so the comparison is
      # against this checkout rather than a number copied into the workflow.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tee, not a bare run: the summary step needs the output even when the
      # check exits non-zero, and pipefail keeps that exit status. Exit 3 is the
      # one deliberately non-red outcome: the host is healthy but runs an older
      # commit, so it becomes a warning annotation that names that commit instead
      # of a failure indistinguishable from a broken deployment.
      - name: Deployed worker matches this checkout, and a cold read carries the row
        run: |
          set -o pipefail
          set +e
          python build/check_live.py 2>&1 | tee live-check.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Undeployed worker commits::$(grep -m1 '^warning  the host' live-check.log | sed 's/^warning  //')"
            echo "deployed host is behind this checkout; see the summary below"
            exit 0
          fi
          exit "$rc"

      # Always runs, so a red run still shows which checks failed without
      # opening the raw log. The job stays failed unless the check exited 3,
      # which the step above turns into a warning on a green run.
      - name: Summary
        if: always()
        run: |
          {
            echo "### live check of the deployed dashboard"
            echo
            echo '```'
            tail -n 40 live-check.log 2>/dev/null || echo "(the check produced no output)"
            echo '```'
            if grep -q '^warning  the host is not broken' live-check.log 2>/dev/null; then
              echo
              echo "> The host is healthy and runs an older commit of this
              > checkout; the commit named above has not been deployed yet.
              > This run is a warning, not a failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
